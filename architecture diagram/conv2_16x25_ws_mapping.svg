<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1350" viewBox="0 0 1800 1350">
  <defs>
    <style>
      text { font-family: "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; fill: #172033; }
      .title { font-size: 34px; font-weight: 700; }
      .h2 { font-size: 25px; font-weight: 700; }
      .h3 { font-size: 20px; font-weight: 700; }
      .body { font-size: 17px; }
      .small { font-size: 14px; }
      .tiny { font-size: 12px; }
      .panel { fill: #f8fafc; stroke: #b7c2d0; stroke-width: 2; rx: 18; }
      .blue { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; }
      .red { fill: #fee2e2; stroke: #dc2626; stroke-width: 2; }
      .purple { fill: #ede9fe; stroke: #7c3aed; stroke-width: 2; }
      .green { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; }
      .orange { fill: #ffedd5; stroke: #ea580c; stroke-width: 2; }
      .arrow { fill: none; stroke: #475569; stroke-width: 3; marker-end: url(#arrow); }
      .thin-arrow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <pattern id="grid14" width="7" height="7" patternUnits="userSpaceOnUse">
      <path d="M7 0H0V7" fill="none" stroke="#93c5fd" stroke-width="0.7"/>
    </pattern>
    <pattern id="peGrid" width="27" height="18" patternUnits="userSpaceOnUse">
      <rect width="27" height="18" fill="#fff7ed" stroke="#e87923" stroke-width="0.7"/>
      <text x="13.5" y="13" text-anchor="middle" font-size="11" fill="#9a3412">×</text>
    </pattern>
  </defs>

  <rect width="1800" height="1350" fill="#ffffff"/>
  <text x="900" y="48" text-anchor="middle" class="title">Conv1 → Pool1 → Conv2：16×25 WS PE阵列映射全过程</text>

  <!-- Step 1: network shapes -->
  <rect x="30" y="75" width="1740" height="285" class="panel"/>
  <text x="55" y="110" class="h2">步骤1：从原图得到 Conv2 的6通道输入</text>

  <rect x="70" y="155" width="125" height="125" class="blue"/>
  <path d="M85 260 Q125 170 180 245 M90 205 Q130 250 177 190" fill="none" stroke="#2563eb" stroke-width="5"/>
  <text x="132" y="310" text-anchor="middle" class="h3">输入图片</text>
  <text x="132" y="334" text-anchor="middle" class="body">1×32×32</text>

  <path d="M210 220H315" class="arrow"/>
  <rect x="335" y="145" width="190" height="150" class="red" rx="12"/>
  <text x="430" y="185" text-anchor="middle" class="h3">Conv1</text>
  <text x="430" y="218" text-anchor="middle" class="body">6个不同的5×5卷积核</text>
  <text x="430" y="250" text-anchor="middle" class="small">同一张原图分别卷积</text>
  <text x="430" y="274" text-anchor="middle" class="small">不是前后串联</text>

  <path d="M540 220H635" class="arrow"/>
  <g transform="translate(650,145)">
    <rect x="25" y="0" width="125" height="125" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
    <rect x="20" y="5" width="125" height="125" fill="#c7d2fe" stroke="#4f46e5" stroke-width="2"/>
    <rect x="15" y="10" width="125" height="125" fill="#bae6fd" stroke="#0284c7" stroke-width="2"/>
    <rect x="10" y="15" width="125" height="125" fill="#ddd6fe" stroke="#7c3aed" stroke-width="2"/>
    <rect x="5" y="20" width="125" height="125" fill="#a7f3d0" stroke="#059669" stroke-width="2"/>
    <rect x="0" y="25" width="125" height="125" fill="#fed7aa" stroke="#ea580c" stroke-width="2"/>
  </g>
  <text x="725" y="322" text-anchor="middle" class="h3">6张不同特征图</text>
  <text x="725" y="345" text-anchor="middle" class="body">6×28×28</text>

  <path d="M820 220H915" class="arrow"/>
  <rect x="930" y="155" width="175" height="125" class="orange" rx="12"/>
  <text x="1018" y="198" text-anchor="middle" class="h3">ReLU</text>
  <text x="1018" y="232" text-anchor="middle" class="h3">2×2 MaxPool</text>
  <text x="1018" y="262" text-anchor="middle" class="small">stride = 2</text>

  <path d="M1120 220H1215" class="arrow"/>
  <g transform="translate(1230,160)">
    <rect x="25" y="0" width="105" height="105" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
    <rect x="20" y="5" width="105" height="105" fill="#c7d2fe" stroke="#4f46e5" stroke-width="2"/>
    <rect x="15" y="10" width="105" height="105" fill="#bae6fd" stroke="#0284c7" stroke-width="2"/>
    <rect x="10" y="15" width="105" height="105" fill="#ddd6fe" stroke="#7c3aed" stroke-width="2"/>
    <rect x="5" y="20" width="105" height="105" fill="#a7f3d0" stroke="#059669" stroke-width="2"/>
    <rect x="0" y="25" width="105" height="105" fill="#fed7aa" stroke="#ea580c" stroke-width="2"/>
  </g>
  <text x="1295" y="310" text-anchor="middle" class="h3">Conv2输入</text>
  <text x="1295" y="337" text-anchor="middle" class="body">6×14×14</text>

  <path d="M1380 220H1460" class="arrow"/>
  <rect x="1475" y="145" width="245" height="150" class="green" rx="12"/>
  <text x="1598" y="183" text-anchor="middle" class="h3">Conv2输出</text>
  <text x="1598" y="216" text-anchor="middle" class="body">16×10×10</text>
  <text x="1598" y="248" text-anchor="middle" class="small">16个输出通道</text>
  <text x="1598" y="273" text-anchor="middle" class="small">每个输出通道融合全部6个输入通道</text>

  <!-- Step 2: windows -->
  <rect x="30" y="385" width="1740" height="305" class="panel"/>
  <text x="55" y="422" class="h2">步骤2：每个14×14通道滑动5×5窗口；每个通道产生10×10＝100个窗口</text>
  <text x="55" y="451" class="body">下面画的是同一个输出坐标 (oy, ox) 在6张不同输入特征图上的6个窗口：</text>

  <g transform="translate(75,480)">
    <g transform="translate(0,0)"><rect width="175" height="150" fill="url(#grid14)" stroke="#2563eb" stroke-width="2"/><rect x="8" y="8" width="62" height="52" fill="#60a5fa" fill-opacity="0.55" stroke="#1d4ed8" stroke-width="3"/><text x="87" y="177" text-anchor="middle" class="body">通道0：5×5窗口</text></g>
    <g transform="translate(260,0)"><rect width="175" height="150" fill="url(#grid14)" stroke="#4f46e5" stroke-width="2"/><rect x="8" y="8" width="62" height="52" fill="#818cf8" fill-opacity="0.55" stroke="#4338ca" stroke-width="3"/><text x="87" y="177" text-anchor="middle" class="body">通道1：5×5窗口</text></g>
    <g transform="translate(520,0)"><rect width="175" height="150" fill="url(#grid14)" stroke="#0284c7" stroke-width="2"/><rect x="8" y="8" width="62" height="52" fill="#38bdf8" fill-opacity="0.55" stroke="#0369a1" stroke-width="3"/><text x="87" y="177" text-anchor="middle" class="body">通道2：5×5窗口</text></g>
    <g transform="translate(780,0)"><rect width="175" height="150" fill="url(#grid14)" stroke="#7c3aed" stroke-width="2"/><rect x="8" y="8" width="62" height="52" fill="#a78bfa" fill-opacity="0.55" stroke="#6d28d9" stroke-width="3"/><text x="87" y="177" text-anchor="middle" class="body">通道3：5×5窗口</text></g>
    <g transform="translate(1040,0)"><rect width="175" height="150" fill="url(#grid14)" stroke="#059669" stroke-width="2"/><rect x="8" y="8" width="62" height="52" fill="#34d399" fill-opacity="0.55" stroke="#047857" stroke-width="3"/><text x="87" y="177" text-anchor="middle" class="body">通道4：5×5窗口</text></g>
    <g transform="translate(1300,0)"><rect width="175" height="150" fill="url(#grid14)" stroke="#ea580c" stroke-width="2"/><rect x="8" y="8" width="62" height="52" fill="#fb923c" fill-opacity="0.55" stroke="#c2410c" stroke-width="3"/><text x="87" y="177" text-anchor="middle" class="body">通道5：5×5窗口</text></g>
  </g>
  <text x="1650" y="545" class="h3">每个窗口</text>
  <text x="1650" y="576" class="body">展开成25个INT8</text>
  <text x="1650" y="607" class="body">送入阵列25列</text>
  <text x="1650" y="645" class="small">窗口右移/下移，</text>
  <text x="1650" y="667" class="small">直到100个位置完成</text>

  <!-- Step 3: PE array -->
  <rect x="30" y="715" width="1740" height="600" class="panel"/>
  <text x="55" y="754" class="h2">步骤3：Conv2映射到16×25 Weight-Stationary PE阵列</text>

  <text x="395" y="800" text-anchor="middle" class="h3" fill="#2563eb">25个激活值：X[ic, window(0…24)]</text>
  <path d="M90 820H720" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="398" y="845" text-anchor="middle" class="small">每一列对应5×5窗口中的一个位置，广播给16个输出通道</text>

  <text x="68" y="940" transform="rotate(-90 68 940)" text-anchor="middle" class="h3">16行＝输出通道 oc=0…15</text>
  <rect x="110" y="865" width="675" height="288" fill="url(#peGrid)" stroke="#ea580c" stroke-width="3"/>
  <text x="448" y="1185" text-anchor="middle" class="body">25列＝卷积核位置 k=0…24（5×5）</text>
  <text x="448" y="1215" text-anchor="middle" class="small" fill="#dc2626">每个PE固定当前轮权重 W[oc, ic, k]，执行 INT8×INT8</text>

  <g class="small">
    <text x="120" y="887">oc0</text><text x="120" y="905">oc1</text><text x="120" y="923">oc2</text>
    <text x="120" y="1015">⋮</text><text x="120" y="1144">oc15</text>
  </g>

  <path d="M800 885H930" class="arrow"/>
  <path d="M800 930H930" class="arrow"/>
  <path d="M800 975H930" class="arrow"/>
  <path d="M800 1125H930" class="arrow"/>
  <rect x="945" y="845" width="255" height="330" class="purple" rx="12"/>
  <text x="1072" y="883" text-anchor="middle" class="h3">每行25项归约相加</text>
  <text x="1072" y="925" text-anchor="middle" class="body">row0 → partial[0]</text>
  <text x="1072" y="965" text-anchor="middle" class="body">row1 → partial[1]</text>
  <text x="1072" y="1005" text-anchor="middle" class="body">row2 → partial[2]</text>
  <text x="1072" y="1045" text-anchor="middle" class="body">⋮</text>
  <text x="1072" y="1085" text-anchor="middle" class="body">row15 → partial[15]</text>
  <text x="1072" y="1135" text-anchor="middle" class="small">乘积INT16</text>
  <text x="1072" y="1158" text-anchor="middle" class="small">部分和/累加器INT32</text>

  <path d="M1215 1010H1280" class="arrow"/>
  <rect x="1295" y="805" width="430" height="385" class="green" rx="12"/>
  <text x="1510" y="842" text-anchor="middle" class="h3">同一输出坐标需要6轮通道累加</text>
  <g class="body">
    <text x="1325" y="885">第0轮：装入 W[:,0,:,:]，psum = partial₀</text>
    <text x="1325" y="925">第1轮：装入 W[:,1,:,:]，psum += partial₁</text>
    <text x="1325" y="965">第2轮：装入 W[:,2,:,:]，psum += partial₂</text>
    <text x="1325" y="1005">第3轮：装入 W[:,3,:,:]，psum += partial₃</text>
    <text x="1325" y="1045">第4轮：装入 W[:,4,:,:]，psum += partial₄</text>
    <text x="1325" y="1085">第5轮：装入 W[:,5,:,:]，psum += partial₅</text>
  </g>
  <rect x="1340" y="1110" width="340" height="58" fill="#bbf7d0" stroke="#15803d" stroke-width="2" rx="10"/>
  <text x="1510" y="1135" text-anchor="middle" class="h3">+ bias → 16个输出值</text>
  <text x="1510" y="1158" text-anchor="middle" class="small">Y[0…15, oy, ox]</text>

  <rect x="90" y="1245" width="1620" height="48" fill="#eef2ff" stroke="#6366f1" stroke-width="2" rx="10"/>
  <text x="900" y="1276" text-anchor="middle" class="body">Y[oc,oy,ox] = bias[oc] + Σ(ic=0…5) Σ(k=0…24) X[ic,window(k)] × W[oc,ic,k]</text>

  <g transform="translate(75,1322)">
    <circle cx="10" cy="0" r="7" fill="#2563eb"/><text x="25" y="6" class="small">激活/特征图</text>
    <circle cx="180" cy="0" r="7" fill="#dc2626"/><text x="195" y="6" class="small">权重</text>
    <circle cx="300" cy="0" r="7" fill="#7c3aed"/><text x="315" y="6" class="small">乘积/部分和</text>
    <circle cx="470" cy="0" r="7" fill="#16a34a"/><text x="485" y="6" class="small">完成输出</text>
    <text x="840" y="6" class="small">WS循环建议：每装入一组权重，扫描该输入通道的全部100个窗口，再换下一输入通道。</text>
  </g>
</svg>
